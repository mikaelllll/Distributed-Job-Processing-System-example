name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --junitxml=test-results.xml
      - run: pip install pip-audit && pip-audit --strict .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api frontend

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27,<1" "pytest>=8.3,<9"
      - run: cp .env.example .env
      - name: Start complete distributed stack
        run: docker compose up -d --build --scale worker=2
      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run end-to-end system tests
        run: python -m pytest tests/e2e -q
      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs --no-color > integration-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-logs
          path: integration-logs.txt
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
